<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>হাজিরা খাতা</title>
<link href="https://fonts.googleapis.com/css2?family=Tiro+Bangla:ital@0;1&family=Hind+Siliguri:wght@400;500;600;700&family=JetBrains+Mono:wght@500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --paper:#F2EDDF;
    --paper-line:#E3D9BE;
    --ledger-red:#9C3B34;
    --ink:#1F2A3D;
    --ink-soft:#5B6478;
    --stamp-green:#2E5B3E;
    --stamp-green-bg:#E7EFE4;
    --stamp-red:#9C3B34;
    --stamp-red-bg:#F3E3DF;
    --stamp-amber:#A85A16;
    --stamp-amber-bg:#F3E6D4;
    --card:#FFFDF8;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent; min-width:0;}
  html,body{overflow-x:hidden; max-width:100%;}
  body{
    margin:0; font-family:'Hind Siliguri', sans-serif; color:var(--ink);
    background:
      repeating-linear-gradient(to bottom, transparent 0 37px, var(--paper-line) 37px 38px),
      var(--paper);
    padding-bottom:84px; font-size:14px;
  }
  .app{max-width:100%; margin:0 auto;}
  @media (min-width:640px){
    body{ background:#DDD6C4; padding-top:24px; padding-bottom:40px; }
    .app{
      max-width:560px; background:var(--paper);
      background-image:repeating-linear-gradient(to bottom, transparent 0 37px, var(--paper-line) 37px 38px);
      border-radius:22px; box-shadow:0 16px 44px rgba(30,25,10,.18); overflow:hidden;
    }
    .cover{border-radius:0;}
    .bar{position:static; margin:16px 12px 12px; border-radius:14px; border:1px solid var(--paper-line); box-shadow:0 2px 10px rgba(90,70,30,.08);}
  }

  .cover{
    background: linear-gradient(180deg, var(--stamp-green) 0%, #26492F 100%);
    color:#F2EDDF;
    padding:22px 18px 20px;
    border-radius:0 0 26px 26px;
    box-shadow:0 8px 22px rgba(20,40,25,.28);
    position:relative;
    overflow:hidden;
  }
  .cover::after{
    content:"";
    position:absolute; left:0; top:0; bottom:0; width:10px;
    background:repeating-linear-gradient(to bottom, rgba(242,237,223,.5) 0 3px, transparent 3px 9px);
  }
  .cover h1{
    font-family:'Tiro Bangla', serif; font-size:26px; margin:0 0 2px 14px;
    letter-spacing:0.3px;
  }
  .cover .est{margin:0 0 16px 14px; font-size:11.5px; opacity:.75; letter-spacing:.4px;}

  .datebar{display:flex; align-items:center; gap:8px; margin-left:14px;}
  .datebar button{
    width:32px; height:32px; border:none; border-radius:9px;
    background:rgba(242,237,223,.16); color:#F2EDDF; font-size:17px; font-weight:700;
  }
  .datebar input[type=date]{
    flex:1; background:rgba(242,237,223,.14); border:1px solid rgba(242,237,223,.3);
    color:#F2EDDF; border-radius:10px; padding:8px 10px; font-family:'JetBrains Mono',monospace;
    font-size:13.5px; font-weight:600;
  }
  .datebar input[type=date]::-webkit-calendar-picker-indicator{filter:invert(1);}

  .shiftbar{
    margin:12px 14px 0; display:flex; align-items:center; gap:10px;
    font-size:12px; opacity:.9;
  }
  .shiftbar .chip{
    display:flex; align-items:center; gap:6px;
    background:rgba(242,237,223,.12); border:1px solid rgba(242,237,223,.25);
    border-radius:20px; padding:5px 10px 5px 12px;
  }
  .shiftbar input[type=time]{
    background:transparent; border:none; color:#F2EDDF; font-family:'JetBrains Mono',monospace;
    font-size:12.5px; font-weight:600;
  }
  .shiftbar input[type=time]::-webkit-calendar-picker-indicator{filter:invert(1);}

  .ledger{
    margin:18px 12px 0; background:var(--card); border:1px solid var(--paper-line);
    border-radius:16px; overflow:hidden; box-shadow:0 2px 10px rgba(90,70,30,.07);
    position:relative;
  }
  .ledger::before{
    content:""; position:absolute; left:0; top:0; bottom:0; width:3px; background:var(--ledger-red);
  }
  .tbl-wrap{overflow-x:auto;}
  table{width:100%; min-width:560px; border-collapse:collapse; font-size:12.5px;}
  th{
    background:#EFE9D9; color:var(--ink-soft); font-family:'JetBrains Mono',monospace;
    padding:10px 6px 9px; font-size:10px; font-weight:700; letter-spacing:.5px; text-align:center;
    border-bottom:1px solid var(--paper-line);
  }
  td{padding:9px 6px; border-top:1px dashed var(--paper-line); text-align:center; vertical-align:middle;}
  td.nm{text-align:right; padding-right:10px; font-weight:700; font-size:13.5px;}
  input.t{
    width:60px; border:1px solid var(--paper-line); border-radius:7px; padding:5px 2px;
    font-family:'JetBrains Mono',monospace; font-size:11.5px; text-align:center; background:#fff; color:var(--ink);
  }

  .stamp{
    display:inline-block; font-family:'JetBrains Mono',monospace; font-weight:700;
    font-size:10.5px; letter-spacing:.4px; padding:4px 9px; border-radius:20px;
    transform:rotate(-3deg); border:1.5px solid currentColor;
  }
  .stamp.present{color:var(--stamp-green); background:var(--stamp-green-bg);}
  .stamp.absent{color:var(--stamp-red); background:var(--stamp-red-bg); transform:rotate(-4deg);}
  .stamp.late{color:var(--stamp-amber); background:var(--stamp-amber-bg); transform:rotate(2deg);}
  .stamp.ontime{color:var(--ink-soft); background:transparent; border-color:var(--paper-line); transform:rotate(0);}

  .dt-val{font-family:'JetBrains Mono',monospace; font-weight:700; color:var(--stamp-green); font-size:13px;}
  .ot-val{font-family:'JetBrains Mono',monospace; font-weight:700; color:var(--stamp-amber); font-size:13px;}
  .ot-zero{font-family:'JetBrains Mono',monospace; color:var(--ink-soft); font-size:12.5px;}

  .del{border:none; background:var(--stamp-red-bg); color:var(--stamp-red); width:24px; height:24px; border-radius:7px; font-weight:700;}
  .empty{padding:30px 14px; text-align:center; color:var(--ink-soft); font-size:13px; line-height:1.7;}

  .addwrap{margin:16px 12px 0; background:var(--card); border:1px solid var(--paper-line); border-radius:16px; padding:14px; position:relative;}
  .addwrap::before{content:""; position:absolute; left:0; top:0; bottom:0; width:3px; background:var(--ledger-red);}
  .addwrap .r{display:flex; gap:8px; margin-bottom:9px;}
  .addwrap input[type=text]{
    flex:1.4; padding:11px 12px; border-radius:10px; border:1px solid var(--paper-line);
    font-family:inherit; font-size:14.5px; background:#fff; color:var(--ink);
  }
  .addwrap input[type=time]{
    flex:1; padding:11px 8px; border-radius:10px; border:1px solid var(--paper-line);
    font-family:'JetBrains Mono',monospace; font-size:13px; background:#fff; color:var(--ink);
  }
  .addwrap .r2{display:flex; gap:8px;}
  .addwrap .r2 button{flex:1; padding:12px 0; border:none; border-radius:10px; font-weight:700; font-size:13.5px; font-family:inherit;}
  .btn-present{background:var(--stamp-green); color:#fff;}
  .btn-absent{background:var(--stamp-red); color:#fff;}

  .preview{min-height:18px; margin:-3px 0 9px 2px; font-size:12.5px;}
  .preview .found{color:var(--stamp-green); font-weight:700;}
  .preview .notfound{color:var(--stamp-amber); font-weight:600;}
  td.card-cell{font-family:'JetBrains Mono',monospace; font-weight:700; color:var(--ink-soft); font-size:12px;}

  .searchrow{display:flex; gap:8px;}
  .searchrow input{
    flex:1; padding:13px 14px; border-radius:10px; border:1px solid var(--paper-line);
    font-family:'JetBrains Mono',monospace; font-size:15px; background:#fff; color:var(--ink);
  }
  .searchrow button{
    padding:0 18px; border:none; border-radius:10px; background:var(--ink); color:#fff;
    font-family:inherit; font-weight:700; font-size:13.5px;
  }
  .result-card{
    margin-top:12px; border:1px solid var(--paper-line); border-radius:12px; padding:12px 14px;
    background:var(--paper); position:relative;
  }
  .result-card.ok{border-color:var(--stamp-green); background:var(--stamp-green-bg);}
  .result-card.warn{border-color:var(--stamp-amber); background:var(--stamp-amber-bg);}
  .result-card .rc-top{display:flex; justify-content:space-between; align-items:center;}
  .result-card .rc-name{font-weight:700; font-size:15px;}
  .result-card .rc-role{font-size:12px; color:var(--ink-soft); margin-top:1px;}
  .result-card .rc-card{font-family:'JetBrains Mono',monospace; font-size:11.5px; color:var(--ink-soft);}
  .result-card .rc-status{margin-top:8px; font-size:12.5px; color:var(--ink-soft);}
  .result-card .rc-actions{display:flex; gap:8px; margin-top:10px;}
  .result-card .rc-actions button{flex:1; padding:11px 0; border:none; border-radius:9px; font-weight:700; font-size:13.5px; font-family:inherit;}
  .rc-in{background:var(--stamp-green); color:#fff;}
  .rc-out{background:var(--stamp-amber); color:#fff;}
  .rc-abs{background:var(--stamp-red); color:#fff;}

  .emp-list{margin-top:10px; display:flex; flex-direction:column; gap:6px; max-height:180px; overflow-y:auto;}
  .emp-row{display:flex; align-items:center; gap:8px; background:var(--paper); border:1px solid var(--paper-line); border-radius:9px; padding:7px 10px; font-size:12.5px;}
  .emp-row .ec{font-family:'JetBrains Mono',monospace; font-weight:700; color:var(--ledger-red); min-width:44px;}
  .emp-row .en{font-weight:700; flex:1;}
  .emp-row .er{color:var(--ink-soft); font-size:11.5px;}
  .emp-row button{border:none; background:var(--stamp-red-bg); color:var(--stamp-red); width:22px; height:22px; border-radius:6px; font-weight:700;}

  .bar{
    position:fixed; left:0; right:0; bottom:0; background:var(--card); border-top:1px solid var(--paper-line);
    padding:10px 12px calc(10px + env(safe-area-inset-bottom)); display:flex; gap:8px;
  }
  .bar button{flex:1; padding:12px 0; border:none; border-radius:10px; font-weight:700; font-size:13px; font-family:inherit;}
  .bar .a{background:var(--stamp-green); color:#fff;}
  .bar .b{background:var(--ink); color:#fff;}
</style>
</head>
<body>
<div class="app">

  <div class="cover">
    <h1>HRIDOY</h1>
    <div class="est">দৈনিক উপস্থিতি</div>
    <div class="datebar">
      <button id="prev">‹</button>
      <input type="date" id="date">
      <button id="next">›</button>
    </div>
    <div class="shiftbar">
      <div class="chip">ইন <input type="time" id="stdIn"></div>
      <div class="chip">আউট <input type="time" id="stdOut"></div>
    </div>
  </div>

  <div class="ledger">
    <div class="tbl-wrap">
      <table>
        <thead><tr><th>#কার্ড</th><th>নাম</th><th>ইন</th><th>আউট</th><th>স্ট্যাটাস</th><th>ডিউটি</th><th>OT</th><th></th></tr></thead>
        <tbody id="tbody"></tbody>
      </table>
    </div>
  </div>

  <div class="addwrap">
    <div class="searchrow">
      <input type="text" id="searchCard" placeholder="কার্ড নম্বর">
      <button id="searchBtn">সার্চ</button>
    </div>
    <div id="searchResult"></div>
  </div>

  <div class="addwrap" style="margin-top:12px;">
    <div style="font-size:12.5px; color:var(--ink-soft); font-weight:700; margin-bottom:8px;">নতুন কর্মী / নতুন কার্ড নম্বর যোগ করুন</div>
    <div class="r">
      <input type="text" id="mCard" placeholder="কার্ড নম্বর" style="flex:0.8;">
      <input type="text" id="mName" placeholder="নাম">
      <input type="text" id="mRole" placeholder="পদবী">
    </div>
    <div class="r2">
      <button class="btn-present" id="mAddBtn">কর্মী সেভ করুন</button>
    </div>
    <div id="empList" class="emp-list"></div>
  </div>

  <div class="bar">
    <button class="a" id="expDay">CSV (আজকে)</button>
    <button class="b" id="expAll">CSV (সব)</button>
  </div>

</div>
<script>
(function(){
  var DKEY='hajira_v5', SKEY='hajira_v5_settings', EKEY='hajira_v5_employees', LUNCH=1;
  var db = JSON.parse(localStorage.getItem(DKEY) || '{}');
  var settings = JSON.parse(localStorage.getItem(SKEY) || '{"stdIn":"08:00","stdOut":"17:00"}');
  var emp = JSON.parse(localStorage.getItem(EKEY) || '{}'); // cardNo -> {name, role}
  var date = todayStr();

  var dateEl=document.getElementById('date'), stdIn=document.getElementById('stdIn'), stdOut=document.getElementById('stdOut'), tbody=document.getElementById('tbody');
  var searchCard=document.getElementById('searchCard'), searchResult=document.getElementById('searchResult');
  dateEl.value=date; stdIn.value=settings.stdIn; stdOut.value=settings.stdOut;
  render();
  renderEmpList();

  function saveE(){ localStorage.setItem(EKEY, JSON.stringify(emp)); }
  function nowHM(){ var d=new Date(); return p(d.getHours())+':'+p(d.getMinutes()); }

  document.getElementById('searchBtn').onclick = doSearch;
  searchCard.addEventListener('keyup', function(e){ if(e.key==='Enter') doSearch(); });

  function doSearch(){
    var card = searchCard.value.trim();
    if(!card){ searchResult.innerHTML=''; return; }
    var e = emp[card];
    if(!e){
      searchResult.innerHTML =
        '<div class="result-card warn">'+
          '<div class="rc-card">কার্ড# '+esc(card)+'</div>'+
          '<div class="rc-status">এই কার্ড নম্বর রেজিস্টার করা নেই — নিচে "নতুন কর্মী" ফর্মে নাম দিয়ে যোগ করুন।</div>'+
        '</div>';
      return;
    }
    var todays = db[date] || [];
    var entry = todays.find(function(x){ return x.card === card; });
    renderResultCard(card, e, entry);
  }

  function renderResultCard(card, e, entry){
    var html = '<div class="result-card ok"><div class="rc-top"><div><div class="rc-name">'+esc(e.name)+'</div><div class="rc-role">'+esc(e.role||'—')+'</div></div><div class="rc-card">কার্ড# '+esc(card)+'</div></div>';

    if(!entry){
      html += '<div class="rc-status">আজ এখনো ইন করেননি</div>';
      html += '<div class="rc-actions"><button class="rc-in" data-act="in">ইন করুন ('+nowHM()+')</button><button class="rc-abs" data-act="abs">অনুপস্থিত</button></div>';
    } else if(entry.absent){
      html += '<div class="rc-status">আজ অনুপস্থিত চিহ্নিত করা আছে</div>';
      html += '<div class="rc-actions"><button class="rc-in" data-act="undo">বাতিল করুন</button></div>';
    } else if(!entry.out){
      html += '<div class="rc-status">ইন সময়: <b>'+entry.in+'</b> — এখনো আউট করেননি</div>';
      html += '<div class="rc-actions"><button class="rc-out" data-act="out">আউট করুন ('+nowHM()+')</button></div>';
    } else {
      var c = calc(entry.in, entry.out);
      html += '<div class="rc-status">ইন: <b>'+entry.in+'</b> · আউট: <b>'+entry.out+'</b> · ডিউটি: <b>'+f(c.reg)+'</b>'+(c.ot>0?' · OT: <b>'+f(c.ot)+'</b>':'')+' — আজকের এন্ট্রি সম্পন্ন</div>';
    }
    html += '</div>';
    searchResult.innerHTML = html;

    var box = searchResult.querySelector('.result-card');
    box.querySelectorAll('button[data-act]').forEach(function(btn){
      btn.onclick = function(){
        var act = btn.dataset.act;
        if(!db[date]) db[date]=[];
        if(act==='in'){
          db[date].push({id:'e'+Date.now()+Math.floor(Math.random()*999), card:card, name:e.name, in:nowHM(), out:'', absent:false});
        } else if(act==='out'){
          var it=db[date].find(function(x){return x.card===card;});
          if(it) it.out = nowHM();
        } else if(act==='abs'){
          db[date].push({id:'e'+Date.now()+Math.floor(Math.random()*999), card:card, name:e.name, in:'', out:'', absent:true});
        } else if(act==='undo'){
          db[date] = db[date].filter(function(x){ return x.card!==card; });
        }
        saveDB(); render(); doSearch();
      };
    });
  }

  document.getElementById('mAddBtn').onclick=function(){
    var c=document.getElementById('mCard').value.trim();
    var n=document.getElementById('mName').value.trim();
    var r=document.getElementById('mRole').value.trim();
    if(!c||!n) return;
    emp[c]={name:n, role:r};
    saveE(); renderEmpList();
    document.getElementById('mCard').value='';
    document.getElementById('mName').value='';
    document.getElementById('mRole').value='';
  };
  function renderEmpList(){
    var keys=Object.keys(emp).sort();
    var el=document.getElementById('empList');
    if(!keys.length){ el.innerHTML='<div style="font-size:12px; color:var(--ink-soft);">কোনো কর্মী রেজিস্টার করা নেই</div>'; return; }
    el.innerHTML = keys.map(function(c){
      var e=emp[c];
      return '<div class="emp-row"><span class="ec">'+esc(c)+'</span><span class="en">'+esc(e.name)+'</span><span class="er">'+esc(e.role||'')+'</span><button data-card="'+esc(c)+'">✕</button></div>';
    }).join('');
    el.querySelectorAll('button[data-card]').forEach(function(b){
      b.onclick=function(){ delete emp[b.dataset.card]; saveE(); renderEmpList(); };
    });
  }

  function todayStr(){ var d=new Date(); return d.getFullYear()+'-'+p(d.getMonth()+1)+'-'+p(d.getDate()); }
  function p(n){ return n<10?'0'+n:''+n; }
  function m(t){ if(!t) return null; var a=t.split(':'); return +a[0]*60+ +a[1]; }
  function f(n){ return n.toFixed(1); }
  function saveDB(){ localStorage.setItem(DKEY, JSON.stringify(db)); }
  function saveS(){ localStorage.setItem(SKEY, JSON.stringify(settings)); }

  function calc(inT,outT){
    if(!inT||!outT) return null;
    var i=m(inT), o=m(outT), so=m(stdOut.value||settings.stdOut);
    if(o<i) o+=1440;
    var regEnd=Math.min(o,so);
    var reg=Math.max(0,(regEnd-i)/60 - LUNCH);
    var ot=o>so ? (o-so)/60 : 0;
    return {reg:reg, ot:ot};
  }
  function isLate(inT){
    if(!inT) return false;
    return m(inT) > m(stdIn.value||settings.stdIn);
  }

  function render(){
    var list=(db[date]||[]).slice().sort(function(a,b){return (a.in||'')<(b.in||'')?-1:1;});
    tbody.innerHTML='';
    if(!list.length){ tbody.innerHTML='<tr><td colspan="8" class="empty">আজকের জন্য এখনো কোনো এন্ট্রি নেই।</td></tr>'; return; }
    list.forEach(function(it){
      var tr=document.createElement('tr');
      if(it.absent){
        tr.innerHTML =
          '<td class="card-cell">'+esc(it.card||'')+'</td>'+
          '<td class="nm">'+esc(it.name)+'</td>'+
          '<td colspan="4"><span class="stamp absent">অনুপস্থিত</span></td>'+
          '<td>—</td>'+
          '<td><button class="del" data-id="'+it.id+'">✕</button></td>';
        tbody.appendChild(tr);
        return;
      }
      var c=calc(it.in,it.out);
      var late=isLate(it.in);
      tr.innerHTML =
        '<td class="card-cell">'+esc(it.card||'')+'</td>'+
        '<td class="nm">'+esc(it.name)+'</td>'+
        '<td><input class="t" type="time" value="'+(it.in||'')+'" data-id="'+it.id+'" data-f="in"></td>'+
        '<td><input class="t" type="time" value="'+(it.out||'')+'" data-id="'+it.id+'" data-f="out"></td>'+
        '<td>'+(late ? '<span class="stamp late">লেট</span>' : '<span class="stamp ontime">ঠিক সময়</span>')+'</td>'+
        '<td>'+(c ? '<span class="dt-val">'+f(c.reg)+'</span>' : '—')+'</td>'+
        '<td>'+(c ? (c.ot>0 ? '<span class="ot-val">'+f(c.ot)+'</span>' : '<span class="ot-zero">0.0</span>') : '—')+'</td>'+
        '<td><button class="del" data-id="'+it.id+'">✕</button></td>';
      tbody.appendChild(tr);
    });
  }
  function esc(s){ return String(s||'').replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];}); }

  document.getElementById('prev').onclick=function(){ shift(-1); };
  document.getElementById('next').onclick=function(){ shift(1); };
  function shift(d){ var dt=new Date(date+'T00:00:00'); dt.setDate(dt.getDate()+d); date=dt.getFullYear()+'-'+p(dt.getMonth()+1)+'-'+p(dt.getDate()); dateEl.value=date; render(); }
  dateEl.onchange=function(){ date=dateEl.value||todayStr(); render(); };

  stdIn.onchange=function(){ settings.stdIn=stdIn.value; saveS(); render(); };
  stdOut.onchange=function(){ settings.stdOut=stdOut.value; saveS(); render(); };

  

  tbody.addEventListener('change', function(e){
    var inp=e.target.closest('input.t'); if(!inp) return;
    var id=inp.dataset.id, fl=inp.dataset.f;
    var it=(db[date]||[]).find(function(x){return x.id===id;});
    if(!it) return;
    it[fl]=inp.value; saveDB(); render();
  });
  tbody.addEventListener('click', function(e){
    var b=e.target.closest('button.del'); if(!b) return;
    db[date]=(db[date]||[]).filter(function(x){return x.id!==b.dataset.id;});
    saveDB(); render();
  });

  function csv(name, rows){
    var s=rows.map(function(r){return r.map(function(v){v=String(v==null?'':v); if(v.indexOf(',')>-1||v.indexOf('"')>-1) v='"'+v.replace(/"/g,'""')+'"'; return v;}).join(',');}).join('\r\n');
    var blob=new Blob(['\uFEFF'+s],{type:'text/csv;charset=utf-8;'});
    var url=URL.createObjectURL(blob), a=document.createElement('a');
    a.href=url; a.download=name; document.body.appendChild(a); a.click(); document.body.removeChild(a);
    setTimeout(function(){URL.revokeObjectURL(url);},1000);
  }
  function rowFor(dt, it){
    if(it.absent) return [dt, it.card||'', it.name, '', '', 'অনুপস্থিত', '', ''];
    var c=calc(it.in,it.out);
    return [dt, it.card||'', it.name, it.in||'', it.out||'', isLate(it.in)?'লেট':'ঠিক সময়', c?f(c.reg):'', c?f(c.ot):''];
  }
  document.getElementById('expDay').onclick=function(){
    var list=db[date]||[]; if(!list.length) return;
    var rows=[['তারিখ','কার্ড#','নাম','ইন','আউট','স্ট্যাটাস','ডিউটি','OT']];
    list.forEach(function(it){ rows.push(rowFor(date,it)); });
    csv('hajira_'+date+'.csv', rows);
  };
  document.getElementById('expAll').onclick=function(){
    var dates=Object.keys(db).sort(); if(!dates.length) return;
    var rows=[['তারিখ','কার্ড#','নাম','ইন','আউট','স্ট্যাটাস','ডিউটি','OT']];
    dates.forEach(function(dt){ (db[dt]||[]).forEach(function(it){ rows.push(rowFor(dt,it)); }); });
    csv('hajira_all.csv', rows);
  };
})();
</script>
</body>
</html>
